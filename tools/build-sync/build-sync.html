<title>Build Sync</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a site trailer's whiteboard. Navy header with a hazard stripe, then
   scannable rows: lot chip, job, trade, a GO / HOLD / WAIT stamp. Phone-first,
   because trades read this standing in a driveway. */
:root{
  --bg:#ECEFF1; --surface:#FFFFFF; --surface2:#E2E6E9; --ink:#15202B; --muted:#56626D; --line:#C9D0D6;
  --brand:#1C3553; --brand-ink:#F4F7FA; --accent:#F2A900; --accent-ink:#1E1500;
  --go:#17804A; --go-bg:#DDF1E5; --hold:#C42F1A; --hold-bg:#FADFD9; --wait:#8A6500; --wait-bg:#F8EDC9;
  --late:#B5501A; --late-bg:#F8E2D3; --done:#66727D; --done-bg:#E3E7EA; --info:#245F9E; --info-bg:#DCE8F5;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1419; --surface:#162029; --surface2:#1E2A35; --ink:#E5EBF0; --muted:#97A4AF; --line:#2B3946;
  --brand:#0F1D2B; --brand-ink:#E9EFF5; --accent:#F5B82E; --accent-ink:#1E1500;
  --go:#45C882; --go-bg:#173326; --hold:#FF7A62; --hold-bg:#3A1C17; --wait:#E9C45A; --wait-bg:#352C12;
  --late:#F29A5E; --late-bg:#3A2416; --done:#8C99A4; --done-bg:#232E38; --info:#7FB2EA; --info-bg:#17293C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1419; --surface:#162029; --surface2:#1E2A35; --ink:#E5EBF0; --muted:#97A4AF; --line:#2B3946;
  --brand:#0F1D2B; --brand-ink:#E9EFF5; --accent:#F5B82E; --accent-ink:#1E1500;
  --go:#45C882; --go-bg:#173326; --hold:#FF7A62; --hold-bg:#3A1C17; --wait:#E9C45A; --wait-bg:#352C12;
  --late:#F29A5E; --late-bg:#3A2416; --done:#8C99A4; --done-bg:#232E38; --info:#7FB2EA; --info-bg:#17293C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--info)}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:30px} h2{font-size:22px} h3{font-size:18px}
.mono{font-family:var(--mono);font-size:.86em;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--brand-ink)}
.hdr::after{content:"";display:block;height:5px;background:repeating-linear-gradient(-45deg,var(--accent) 0 10px,var(--brand) 10px 20px)}
.hdr-in{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px}
.logo{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.02em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo i{display:inline-block;width:14px;height:14px;background:var(--accent);transform:rotate(45deg)}
.logo small{font-family:var(--body);font-weight:500;font-size:12px;opacity:.7;letter-spacing:.06em;text-transform:uppercase}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap;flex:1}
nav.tabs a{color:var(--brand-ink);text-decoration:none;white-space:nowrap;flex:none;padding:6px 10px;border-radius:var(--r);font-weight:600;font-size:14px;opacity:.82;position:relative}
nav.tabs a:hover{opacity:1;background:rgba(255,255,255,.08)}
nav.tabs a[aria-current="page"]{opacity:1;background:rgba(255,255,255,.14);box-shadow:inset 0 -3px 0 var(--accent)}
nav.tabs .badge{position:static;margin-left:5px}
.conn{font-size:12px;opacity:.85;white-space:nowrap}
.conn b{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:5px;vertical-align:middle}
.conn.live b{background:#4fd48a}

main{padding-block:20px 60px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-h p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.grid{display:grid;gap:16px}
.cols{display:grid;gap:16px;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card>h2,.card>h3{margin-bottom:10px;display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--muted)}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:16px}
@media (max-width:860px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:460px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;text-decoration:none;color:inherit}
.kpi b{font-family:var(--display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--muted);font-weight:500}
.kpi.bad b{color:var(--hold)} .kpi.warn b{color:var(--late)} .kpi.ok b{color:var(--go)}

/* rows */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row>.lot,.row>.chip,.row>.stamp{justify-self:start}
.row .main{min-width:0}
.row .t{font-weight:600}
.row .s{font-size:13px;color:var(--muted)}
.row .why{font-size:13px;margin-top:2px}
.row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:640px){.row{grid-template-columns:auto minmax(0,1fr) auto}.row .acts{grid-column:1/-1;justify-content:flex-start}}
.lot{font-family:var(--mono);font-size:12px;font-weight:500;background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:3px 6px;white-space:nowrap;text-decoration:none;color:var(--ink)}
a.lot:hover{border-color:var(--ink)}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.date-h{font-family:var(--display);font-size:17px;padding:14px 0 4px;display:flex;gap:10px;align-items:baseline;border-bottom:2px solid var(--ink)}
.date-h.today{border-color:var(--accent)}

/* stamps and chips */
.stamp{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.06em;padding:2px 8px;border-radius:4px;border:2px solid currentColor;white-space:nowrap;text-transform:uppercase}
.st-go{color:var(--go);background:var(--go-bg)} .st-hold{color:var(--hold);background:var(--hold-bg)}
.st-pending{color:var(--wait);background:var(--wait-bg)} .st-done{color:var(--done);background:var(--done-bg)}
.st-delayed{color:var(--late);background:var(--late-bg)}
.chip{font-size:12px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.info{background:var(--info-bg);color:var(--info)} .chip.late{background:var(--late-bg);color:var(--late)}
.chip.go{background:var(--go-bg);color:var(--go)} .chip.hold{background:var(--hold-bg);color:var(--hold)}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--hold);color:#fff;font-size:11px;font-weight:700}

/* buttons and forms */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 11px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(.95)}
.btn.danger{color:var(--hold);border-color:var(--hold)}
.btn.go{color:var(--go);border-color:var(--go)}
.btn.sm{padding:4px 8px;font-size:13px}
.btn.big{padding:10px 14px;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
input[type=text],input[type=date],input[type=number],input[type=tel],input[type=email],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;font-weight:500;color:var(--ink);width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.form .full{grid-column:1/-1}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--ink);font-weight:500}
.check input{margin-top:3px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.filters label.f{width:auto;min-width:160px}

/* home cards */
.homes{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.home{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit}
.home:hover{border-color:var(--ink)}
.home .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.prog{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;display:flex}
.prog i{display:block;background:var(--go)}
.prog i.l{background:var(--late)}
.meta{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}

/* home detail table */
.tbl-wrap{overflow-x:auto}
table.tasks{width:100%;border-collapse:collapse;font-size:14px}
table.tasks th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:2px solid var(--ink)}
table.tasks td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
table.tasks tr.phase td{font-family:var(--display);font-size:16px;font-weight:700;padding-top:16px;border-bottom:1px solid var(--ink);background:none}
table.tasks tr.task{cursor:pointer}
table.tasks tr.task:hover td{background:var(--surface2)}
table.tasks tr.isdone td{color:var(--muted)}

/* photos */
.photos{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.photo{margin:0;display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.photo .ph{aspect-ratio:4/3;max-width:100%;border-radius:4px;background:var(--surface2) center/cover no-repeat;border:1px solid var(--line);display:grid;place-items:center;font-size:11px;text-align:center;padding:4px;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo figcaption{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up{display:inline-flex}
.up input{position:absolute;opacity:0;width:1px;height:1px}

/* notices */
.notice{border:1px solid var(--line);border-left:6px solid var(--info);border-radius:var(--r);padding:12px 14px;background:var(--surface);display:grid;gap:6px}
.notice.hold{border-left-color:var(--hold)} .notice.reschedule{border-left-color:var(--late)} .notice.go{border-left-color:var(--go)}
.notice .nt{font-weight:700;font-size:16px}
.notice.acked{opacity:.72}
.sms{font-family:var(--mono);font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px;white-space:pre-wrap;word-break:break-word}

/* trade view job cards */
.jobs{display:grid;gap:10px}
.job{display:grid;gap:8px;border-left:6px solid var(--line)}
.job.go{border-left-color:var(--go)} .job.hold{border-left-color:var(--hold)} .job.pending{border-left-color:var(--wait)} .job.delayed{border-left-color:var(--late)} .job.done{border-left-color:var(--done)}
.job .jt{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.job .when{font-family:var(--display);font-size:20px}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(10,16,22,.55);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 4vh) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px));overflow-y:auto}
.modal{background:var(--surface);border-radius:8px;border:1px solid var(--line);width:min(640px,100%);padding:18px;display:grid;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal .mh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.x{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:2px 6px}
.preview{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font-size:14px}
.preview ul{margin:6px 0 0;padding-left:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-weight:600;z-index:30;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgba(0,0,0,.3)}
.banner{background:var(--wait-bg);color:var(--ink);border:1px solid var(--wait);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;font-size:14px}

/* empty state */
.hero-empty{display:grid;gap:14px;max-width:720px}
.hero-empty .steps{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.hero-empty .steps div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}

/* playbook */
.ideas{columns:2 340px;column-gap:16px}
.ideas .card{break-inside:avoid;margin-bottom:16px}
.ideas ol{margin:0;padding-left:22px;display:grid;gap:6px}
.ideas li{padding-left:2px}
.ideas li .chip{margin-left:4px}
details summary{cursor:pointer;font-weight:600}
.timeline{font-size:13px}
.timeline .row{grid-template-columns:auto minmax(0,1fr)}
@media (max-width:760px){nav.tabs{order:3;flex:1 0 100%;flex-wrap:nowrap;overflow-x:auto;margin:0 -4px;padding-bottom:2px}.conn{margin-left:auto}.logo small{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="hdr">
  <div class="wrap hdr-in">
    <div class="logo"><i aria-hidden="true"></i>Build Sync <small>Site &amp; trade board</small></div>
    <nav class="tabs" id="nav" aria-label="Sections">
      <a href="#today">Today</a>
      <a href="#homes">Homes</a>
      <a href="#lookahead">Lookahead</a>
      <a href="#trade">My jobs</a>
      <a href="#playbook">Playbook</a>
      <a href="#setup">Setup</a>
    </nav>
    <div class="conn" id="conn"><b></b>Connecting…</div>
  </div>
</header>
<main class="wrap" id="app" aria-live="polite">
  <div class="card"><h2>Loading the board…</h2><p class="muted">Homes, schedules, trade notices and site photos appear here once the shared board connects.</p></div>
</main>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>

<script>
'use strict';
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid = p => p + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
const ds = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
let TODAY = ds(new Date());
const addCal = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return ds(d); };
const isSun = s => pd(s).getDay() === 0;
const nextWork = s => { while (isSun(s)) s = addCal(s, 1); return s; };
const addWork = (s, n) => { s = nextWork(s); const step = n < 0 ? -1 : 1; while (n !== 0) { s = addCal(s, step); if (!isSun(s)) n -= step; } return s; };
const finishOf = (date, dur) => addWork(date, Math.max(1, dur || 1) - 1);
const fin = t => finishOf(t.date, t.dur);
const after = s => addWork(s, 1);
const daysTo = s => Math.round((pd(s) - pd(TODAY)) / 864e5);
const fmt = s => s ? pd(s).toLocaleDateString('en-CA', { weekday: 'short', month: 'short', day: 'numeric' }) : '';
const fmtShort = s => s ? pd(s).toLocaleDateString('en-CA', { month: 'short', day: 'numeric' }) : '';
const rel = s => { const n = daysTo(s); return n === 0 ? 'today' : n === 1 ? 'tomorrow' : n === -1 ? 'yesterday' : n < 0 ? (-n) + ' days ago' : 'in ' + n + ' days'; };
const ago = iso => { if (!iso) return ''; const m = Math.round((Date.now() - new Date(iso)) / 6e4); if (m < 1) return 'just now'; if (m < 60) return m + ' min ago'; const h = Math.round(m / 60); if (h < 24) return h + ' h ago'; const d = Math.round(h / 24); return d + ' d ago'; };
const nowIso = () => new Date().toISOString();
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
function toast(msg, ms = 2600) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, ms); }

/* ---------- the build template ----------
   [key, job, trade category, phase, working days, depends on]
   Order is topological. Dates are worked out from the dependencies. */
const TEMPLATE = [
  ['survey','Survey & stake-out','Surveyor','Foundation',1,[]],
  ['excav','Excavation','Excavation','Foundation',2,['survey']],
  ['footings','Footings','Concrete','Foundation',2,['excav']],
  ['walls','Foundation walls','Concrete','Foundation',3,['footings']],
  ['weeping','Damp-proofing & weeping tile','Waterproofing','Foundation',1,['walls']],
  ['ugPlumb','Under-slab plumbing','Plumbing','Foundation',1,['walls']],
  ['backfill','Backfill & rough grade','Excavation','Foundation',1,['weeping']],
  ['slab','Basement slab','Concrete','Foundation',1,['ugPlumb','backfill']],
  ['framing','Framing','Framing','Framing',10,['slab']],
  ['roof','Roofing','Roofing','Framing',2,['framing']],
  ['windows','Windows & exterior doors','Windows','Framing',2,['framing']],
  ['plumbRough','Rough plumbing','Plumbing','Rough-in',3,['roof','windows']],
  ['hvacRough','Rough HVAC & ductwork','HVAC','Rough-in',3,['roof','windows']],
  ['elecRough','Rough electrical','Electrical','Rough-in',3,['plumbRough','hvacRough']],
  ['lowV','Low-voltage pre-wire','Low voltage','Rough-in',1,['elecRough']],
  ['roughInsp','Framing & rough-in inspections','Inspection','Rough-in',1,['lowV']],
  ['exterior','Siding, stone & eaves','Exterior','Exterior',6,['windows']],
  ['insul','Insulation & vapour barrier','Insulation','Drywall',2,['roughInsp']],
  ['insulInsp','Insulation inspection','Inspection','Drywall',1,['insul']],
  ['heat','Furnace start-up (temporary heat)','HVAC','Drywall',1,['insulInsp']],
  ['drywall','Drywall: board, tape & mud','Drywall','Drywall',8,['heat']],
  ['paint','Prime & paint','Painting','Finishing',3,['drywall']],
  ['cabinets','Cabinets & vanities','Cabinets','Finishing',2,['paint']],
  ['trim','Doors & finish carpentry','Finish carpentry','Finishing',3,['paint']],
  ['counters','Countertops','Countertops','Finishing',1,['cabinets']],
  ['tile','Tile & backsplash','Tile','Finishing',2,['counters']],
  ['hardwood','Hardwood flooring','Flooring','Finishing',2,['trim','tile']],
  ['ductClean','Duct & furnace cleaning','Duct cleaning','Finishing',1,['hardwood']],
  ['elecFin','Finish electrical','Electrical','Finishing',2,['hardwood']],
  ['plumbFin','Finish plumbing','Plumbing','Finishing',2,['hardwood']],
  ['carpet','Carpet','Flooring','Finishing',1,['ductClean','elecFin','plumbFin']],
  ['grade','Final grade, sod & driveway','Landscaping','Exterior',3,['exterior']],
  ['appliances','Appliances','Appliances','Final',1,['carpet']],
  ['touchup','Paint touch-up','Painting','Final',1,['carpet']],

/* in-memory stand-in, used only where the shared store isn't available (a local file, a preview) */
function memDB() {
  const cols = {}, subs = {};
  const emit = c => (subs[c] || []).forEach(f => f());
  const merge = (a, b) => { for (const k in b) { if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && a[k] && typeof a[k] === 'object' && !Array.isArray(a[k])) merge(a[k], b[k]); else a[k] = b[k]; } return a; };
  const col = c => { cols[c] = cols[c] || {}; const ref = {
    doc(id) { id = id || rid('d'); return { id,
      set: async d => { cols[c][id] = JSON.parse(JSON.stringify(d)); emit(c); },
      update: async d => { if (!cols[c][id]) throw { code: 'invalid_argument' }; merge(cols[c][id], JSON.parse(JSON.stringify(d))); emit(c); },
      delete: async () => { delete cols[c][id]; emit(c); } }; },
    orderBy() { return ref; }, limit() { return ref; },
    onSnapshot(next) { const f = () => next({ docs: Object.entries(cols[c]).map(([id, v]) => ({ id, exists: true, data: () => v })), metadata: { fromCache: false } }); (subs[c] = subs[c] || []).push(f); setTimeout(f); return () => {}; } };
    return ref; };

}

/* one write at a time per document */
const chains = {};

  else if (e && e.code === 'quota_exceeded') toast('The board is full. Remove old homes or photos in Setup, then try again.', 5000);
  else toast('That change did not save. Check your connection and try again.', 4000);

}

function readiness(h, t) {
  if (t.status === 'done') return { s: 'done', label: 'Done', why: [] };
  if (t.tbd) return { s: 'delayed', label: 'Delayed', why: ['New date not set yet' + (t.delayReason ? ': ' + t.delayReason.toLowerCase() : '')] };
  const bl = [], wait = [];
  for (const d of t.deps || []) {
    const p = h.tasks[d]; if (!p || p.removed || p.status === 'done') continue;
    const pf = fin(p);
    if (p.tbd) bl.push(p.name + ' is delayed, no new date yet');
    else if (pf >= t.date) bl.push(p.name + ' runs until ' + fmt(pf));
    else if (pf < TODAY) bl.push(p.name + ' was due ' + fmtShort(pf) + ' and isn’t marked done');
    else wait.push(p.name + ' (' + fmtShort(p.date) + (p.dur > 1 ? '–' + fmtShort(pf) : '') + ')');
  }
  if (bl.length) return { s: 'hold', label: 'Hold', why: bl };
  if (t.delayed) return { s: 'delayed', label: 'Moved', why: ['Rescheduled' + (t.delayReason ? ': ' + t.delayReason.toLowerCase() : '')] };
  if (wait.length) return { s: 'pending', label: 'Wait', why: ['After ' + wait.join(', ')] };
  return { s: 'go', label: 'Go', why: [] };
}
const stampHtml = r => `<span class="stamp st-${r.s}">${esc(r.label)}</span>`;
const statusChip = t => t.status === 'onsite' ? '<span class="chip info">On site</span>' : t.status === 'done' ? '' : t.confirmed ? '<span class="chip go">Confirmed</span>' : '<span class="chip">Not confirmed</span>';
function homePhase(h) { const ts = liveTasks(h).sort((a, b) => a.seq - b.seq); const n = ts.find(t => t.status !== 'done'); return n ? n.phase : 'Complete'; }
function homeProgress(h) { const ts = liveTasks(h); const d = ts.filter(t => t.status === 'done').length; return { done: d, total: ts.length, pct: ts.length ? Math.round(d / ts.length * 100) : 0 }; }
function possessionDate(h) { const p = liveTasks(h).find(t => t.key === 'possession'); return h.possession || (p && p.date) || ''; }

/* downstream: which jobs a date change pushes, and to when */
function planShift(h, changedId, newDate, shift) {
  const tasks = h.tasks, dates = { [changedId]: newDate }, down = new Set([changedId]), out = [];
  const order = Object.entries(tasks).filter(([, t]) => !t.removed).sort((a, b) => a[1].seq - b[1].seq);
  for (const [id, t] of order) {
    if (id === changedId || t.status === 'done' || !(t.deps || []).some(d => down.has(d))) continue;
    let req = t.date;
    for (const pid of t.deps) { const p = tasks[pid]; if (!p || p.removed || p.status === 'done') continue; const a = after(finishOf(dates[pid] || p.date, p.dur)); if (a > req) req = a; }
    if (req > t.date) { out.push({ id, from: t.date, to: req }); down.add(id); if (shift) dates[id] = req; }
  }
  return out;
}
function downstreamAll(h, startId, withinDays = 21) {
  const down = new Set([startId]), out = [];
  for (const [id, t] of Object.entries(h.tasks).filter(([, t]) => !t.removed).sort((a, b) => a[1].seq - b[1].seq)) {
    if (id === startId || t.status === 'done') continue;
    if ((t.deps || []).some(d => down.has(d))) { down.add(id); if (daysTo(t.date) <= withinDays) out.push({ id, from: t.date, to: null }); }
  }
  return out;
}
function smsText(n) {

}

/* ---------- actions on jobs ---------- */
async function setStatus(homeId, tid, status) {
  const h = S.homes[homeId], t = h.tasks[tid];
  const p = { status, ...stamp() };
  if (status === 'done') Object.assign(p, { delayed: false, tbd: false, doneAt: nowIso() });
  if (status === 'onsite') Object.assign(p, { confirmed: true, tbd: false });
  await patchHome(homeId, { [tid]: p });
  await addLog(homeId, `${t.name}: ${status === 'done' ? 'marked done' : status === 'onsite' ? 'trade on site' : status}`, tid);
  if (status === 'done') {
    const sim = { ...h.tasks, [tid]: { ...t, status: 'done' } };
    for (const [id, d] of Object.entries(h.tasks)) {
      if (d.removed || d.status === 'done' || !(d.deps || []).includes(tid) || !d.tradeId) continue;
      const r = readiness({ ...h, tasks: sim }, d);
      if (r.s === 'go' && daysTo(d.date) <= 7) await addNotice({ kind: 'go', tradeId: d.tradeId, homeId, taskId: id, title: `GO: ${d.name} on ${fmt(d.date)}`, body: `${t.name} is finished. You are clear to proceed on ${fmt(d.date)}.` });
    }
    toast(t.name + ' marked done');
  } else toast(t.name + (status === 'onsite' ? ': on site' : ' updated'));
}
async function confirmJob(homeId, tid) {
  const t = S.homes[homeId].tasks[tid];
  await patchHome(homeId, { [tid]: { confirmed: true, delayed: false, confirmedAt: nowIso(), ...stamp() } });
  await addLog(homeId, `${t.name}: ${tradeName(t.tradeId)} confirmed for ${fmt(t.date)}`, tid);
  toast('Confirmed for ' + fmt(t.date));
}
async function applyDelay(homeId, tid, { newDate, tbd, reason, note, shift }) {
  const h = S.homes[homeId], t = h.tasks[tid];
  const affected = tbd ? downstreamAll(h, tid) : planShift(h, tid, newDate, shift);
  const tp = { [tid]: { delayed: true, tbd: !!tbd, delayReason: reason, delayNote: note || '', origDate: t.origDate || t.date, confirmed: false, status: t.status === 'done' ? 'done' : 'scheduled', ...stamp() } };
  if (!tbd) tp[tid].date = newDate;
  if (shift && !tbd) for (const a of affected) tp[a.id] = { date: a.to, delayed: true, delayReason: `${t.name} moved`, origDate: h.tasks[a.id].origDate || a.from, confirmed: false, ...stamp() };
  await patchHome(homeId, tp);
  const why = `${t.name} ${tbd ? 'is delayed, new date not set' : 'moved to ' + fmt(newDate)} (${reason.toLowerCase()})${note ? '. ' + note.replace(/[.\s]+$/, '') : ''}.`;
  await addLog(homeId, `DELAY ${t.name}: ${tbd ? 'date TBD' : fmtShort(t.date) + ' → ' + fmtShort(newDate)}. ${reason}${note ? ' – ' + note : ''}`, tid);
  let sent = 0;
  if (t.tradeId) { await addNotice({ kind: 'reschedule', tradeId: t.tradeId, homeId, taskId: tid, title: tbd ? `ON HOLD: ${t.name}` : `MOVED: ${t.name} to ${fmt(newDate)}`, body: tbd ? `Do not attend on ${fmt(t.date)}. ${reason}. A new date will follow.` : `Was ${fmt(t.date)}, now ${fmt(newDate)}. ${reason}.` }); sent++; }
  for (const a of affected) {
    const d = h.tasks[a.id]; if (!d.tradeId) continue;
    const moved = shift && !tbd;
    await addNotice({ kind: moved ? 'reschedule' : 'hold', tradeId: d.tradeId, homeId, taskId: a.id,
      title: moved ? `MOVED: ${d.name} to ${fmt(a.to)}` : `HOLD: do not attend ${d.name} on ${fmt(d.date)}`,
      body: moved ? `Was ${fmt(a.from)}. Reason: ${why}` : `Reason: ${why} A new date will follow.` });
    sent++;
  }

}

    ${kpi(overdue.length, 'past due, not marked done', 'warn', '#today')}

        ${unconf.length ? `<div class="eyebrow" style="margin-top:14px">Today and next work day, not confirmed by the trade</div><div class="rows">${unconf.map(x => taskRow(x.h, x.t, { showDate: true })).join('')}</div>` : ''}
      </section>
      <section class="card"><h2>On site today <span class="chip">${today.length}</span></h2>
        ${today.length ? `<div class="rows">${today.map(x => taskRow(x.h, x.t)).join('')}</div>` : '<div class="empty">No jobs scheduled today.</div>'}
      </section>
    </div>

function logList(logs) {

  return `<div class="rows timeline">${logs.map(l => { const h = S.homes[l.homeId]; return `<div class="row">${h ? `<a class="lot" href="#home-${esc(h.id)}">${esc(lotLabel(h))}</a>` : '<span></span>'}<div class="main"><div>${esc(l.text)}</div><div class="s">${esc(ago(l.at))} · <span data-name="${esc(l.by || '')}">${esc(nameOf(l.by))}</span></div></div></div>`; }).join('')}</div>`;
}
function noticeCard(n, pmView) {
  const h = S.homes[n.homeId], tr = S.trades[n.tradeId];

  return `<div class="notice ${esc(n.kind)} ${n.ack ? 'acked' : ''}">
    <div class="bar" style="justify-content:space-between"><span class="eyebrow">${pmView ? esc(tradeName(n.tradeId)) : esc(n.kind === 'go' ? 'Clear to proceed' : n.kind === 'hold' ? 'Do not attend' : 'Schedule change')}</span><span class="muted" style="font-size:12px">${esc(ago(n.at))}</span></div>

views.home = id => {

  const photos = Object.entries(S.photos).filter(([, p]) => p.homeId === id).map(([pid, p]) => ({ id: pid, ...p }));
  const issues = Object.entries(S.issues).filter(([, i]) => i.homeId === id).map(([iid, i]) => ({ id: iid, ...i })).sort((a, b) => (a.status === 'fixed') - (b.status === 'fixed'));
  const logs = Object.values(S.log).filter(l => l.homeId === id).sort((a, b) => (b.at || '').localeCompare(a.at || '')).slice(0, 25);
  let lastPhase = null;
  const rows = ts.sort((a, b) => PHASES.indexOf(a.phase) - PHASES.indexOf(b.phase) || a.date.localeCompare(b.date) || a.seq - b.seq).map(t => {

      <td>${esc(tradeName(t.tradeId))}</td><td>${statusChip(t)}${pc ? ` <span class="chip">${pc} photo${pc > 1 ? 's' : ''}</span>` : ''}</td><td>${stampHtml(r)}</td></tr>`;

views.lookahead = () => {
  const f = { c: store.get('bs-lc') || '', t: store.get('bs-lt') || '', p: store.get('bs-lp') === '1' };
  const end = addCal(TODAY, 14);
  const items = allTasks().filter(t => t.status !== 'done' && fin(t) >= TODAY && t.date <= end).map(t => ({ t, h: S.homes[t.homeId] })).map(x => ({ ...x, r: readiness(x.h, x.t) }))
    .filter(x => (!f.c || x.h.community === f.c) && (!f.t || x.t.tradeId === f.t) && (!f.p || ['hold', 'delayed'].includes(x.r.s) || !x.t.confirmed));
  const comms = [...new Set(homeList().map(h => h.community).filter(Boolean))].sort();
  const days = []; for (let d = TODAY; d <= end; d = addCal(d, 1)) days.push(d);
  const body = days.map(d => { const list = items.filter(x => x.t.date === d || (d === TODAY && x.t.date < TODAY)); if (!list.length) return ''; return `<div class="date-h ${d === TODAY ? 'today' : ''}">${esc(fmt(d))}<span class="muted" style="font-size:14px;font-family:var(--body)">${esc(rel(d))} · ${list.length} job${list.length > 1 ? 's' : ''}</span></div><div class="rows">${list.map(x => taskRow(x.h, x.t, { compact: true })).join('')}</div>`; }).join('');
  return `<div class="page-h"><div><h1>Two-week lookahead</h1><p>Every job starting in the next 14 days. Jobs that start before today and aren’t finished show under today.</p></div></div>
  <div class="filters">
    <label class="f">Community<select id="lc"><option value="">All communities</option>${comms.map(c => `<option ${c === f.c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></label>
    <label class="f">Trade company<select id="lt"><option value="">All trades</option>${tradeOptions(f.t)}</select></label>
    <label class="check" style="padding-bottom:8px"><input type="checkbox" id="lp" ${f.p ? 'checked' : ''}> Only holds, delays and unconfirmed</label>
  </div>
  <section class="card">${body || '<div class="empty">Nothing matches in the next two weeks.</div>'}</section>`;
};
function tradeOptions(sel, cat) {
  return Object.entries(S.trades).filter(([, t]) => !cat || t.category === cat).sort((a, b) => (a[1].category + a[1].name).localeCompare(b[1].category + b[1].name))
    .map(([id, t]) => `<option value="${esc(id)}" ${id === sel ? 'selected' : ''}>${esc(t.name)} – ${esc(t.category)}</option>`).join('');
}

async function loadDemo() {

  const tdocs = CATEGORIES.map((cat, k) => [trades[cat], { name: DEMO_TRADES[cat] || cat + ' (example)', category: cat, contact: 'Dispatch', phone: '780-555-01' + pad(k + 10), email: '', demo: true }]);

  // Lot 14: hardwood today, duct cleaning next work day. Lot 7: drywall stage with a failed insulation inspection.
  const mk = (lot, address, community, model, anchorKey, anchorOffset) => {
    let tasks = buildTasks(TODAY, pick);
    const anchor = Object.values(tasks).find(t => t.key === anchorKey);
    const shiftDays = -[...Array(400)].findIndex((_, n) => addWork(TODAY, n) >= anchor.date);
    let start = addWork(TODAY, shiftDays + anchorOffset);
    tasks = buildTasks(start, pick);
    for (const t of Object.values(tasks)) { if (fin(t) < TODAY) { t.status = 'done'; t.confirmed = true; } else if (daysTo(t.date) <= 2) t.confirmed = true; }
    return { id: rid('h'), lot, address, community, model, notes: 'Lockbox 4417 (example)', demo: true, createdAt: nowIso(), tasks };
  };
  const homes = [
    mk('14', '1428 Example Crescent NW', 'Glenridding Heights', '2-storey, 2,100 sq ft', 'hardwood', -1),

    mk('31', '2050 Placeholder Drive', 'Rosenthal', 'Laned home, 1,780 sq ft', 'finalInsp', 0),
  ];

  const l14 = homes[0]; const dc = Object.values(l14.tasks).find(t => t.key === 'ductClean'); dc.confirmed = false; dc.notes = 'Leave registers off until carpet is in.';
  const jobs = [...tdocs.map(([id, d]) => () => put('trades', id, d)), ...homes.map(h => () => put('homes', h.id, h))];
  await runPool(jobs, 4);
  // Lot 7: the insulation inspection failed today -> date unknown -> trades after it go on hold
  const l7 = homes[1]; const ins = Object.entries(l7.tasks).find(([, t]) => t.key === 'insulInsp');
  await waitFor(() => S.homes[l7.id]);
  await applyDelay(l7.id, ins[0], { tbd: true, reason: 'Failed inspection', note: 'Vapour barrier not sealed at two attic hatches. Re-inspection to be booked.', shift: false });
  const l31 = homes[3]; const tr = id => Object.values(l31.tasks).find(t => t.key === id).tradeId;
  const iss = [
    { homeId: l31.id, text: 'Scuffed baseboard at front entry', room: 'Front hall', tradeId: tr('touchup') },
    { homeId: l31.id, text: 'Ensuite tap drips when closed', room: 'Ensuite', tradeId: tr('plumbFin') },
    { homeId: l31.id, text: 'Pantry door rubs on the frame', room: 'Kitchen', tradeId: tr('trim') },
  ];
  await runPool(iss.map(x => () => put('issues', rid('i'), { ...x, status: 'open', at: nowIso(), by: meId || null, demo: true })), 3);
  await addLog(l14.id, 'Sample build loaded. Try it: open Hardwood flooring on Lot 14 and report a delay.');

function waitFor(fn, ms = 8000) { return new Promise(res => { const t0 = Date.now(); const tick = () => fn() || Date.now() - t0 > ms ? res() : setTimeout(tick, 150); tick(); }); }
async function clearDemo() {
  const jobs = [];
  for (const [id, h] of Object.entries(S.homes)) if (h.demo) jobs.push(() => del('homes', id));
  for (const [id, t] of Object.entries(S.trades)) if (t.demo) jobs.push(() => del('trades', id));

  try {
    if (f.id === 'delayForm') {
      const tbd = $('#df-tbd').checked, nd = v('df-date');
      if (!tbd && !nd) return toast('Pick a new date, or tick "New date not known yet".');
      f.querySelector('button[type=submit]').disabled = true;
      await applyDelay(f.dataset.h, f.dataset.t, { newDate: nd, tbd, reason: v('df-reason'), note: v('df-note').trim(), shift: $('#df-shift').checked });
      closeModal();
    }
    if (f.id === 'taskForm') {
      const date = v('tf-date'); if (!date) return toast('Pick a start date.');
      await patchHome(f.dataset.h, { [f.dataset.t]: { date, dur: Math.max(1, parseInt(v('tf-dur'), 10) || 1), tradeId: v('tf-trade') || null, notes: v('tf-notes').trim(), ...stamp() } });
      await addLog(f.dataset.h, S.homes[f.dataset.h].tasks[f.dataset.t].name + ': job details edited', f.dataset.t); toast('Job saved'); refreshModal();
    }
    if (f.id === 'homeForm') {
      const data = { lot: v('hf-lot').trim(), address: v('hf-addr').trim(), community: v('hf-comm').trim(), model: v('hf-model').trim(), notes: v('hf-notes').trim() };
      if (f.dataset.h) { await patch('homes', f.dataset.h, { ...data, ...stamp() }); toast('Home saved'); closeModal(); }
      else { const id = rid('h'); await put('homes', id, { ...data, createdAt: nowIso(), ...stamp(), tasks: buildTasks(v('hf-start') || TODAY) }); await addLog(id, 'Home added with the standard 38-job schedule'); closeModal(); location.hash = '#home-' + id; toast('Home added. Schedule built.'); }
    }
    if (f.id === 'tradeForm') {
      const data = { name: v('trf-name').trim(), category: v('trf-cat'), contact: v('trf-contact').trim(), phone: v('trf-phone').trim(), email: v('trf-email').trim() };
      if (!data.name) return toast('Enter the company name.');
      const id = f.dataset.id || rid('tr'); const old = S.trades[id];
      await put('trades', id, { ...(old || {}), ...data, ...stamp() }); closeModal(); toast('Trade saved');
      if (!old) { // assign the new company to unassigned jobs of that trade
        const jobs = homeList().map(h => { const p = {}; for (const [tid, t] of Object.entries(h.tasks || {})) if (!t.removed && t.trade === data.category && !t.tradeId && t.status !== 'done') p[tid] = { tradeId: id }; return Object.keys(p).length ? () => patchHome(h.id, p) : null; }).filter(Boolean);
        if (jobs.length) { await runPool(jobs, 3); toast(`Trade saved and assigned to ${data.category} jobs that had no company`); }
      }
    }
    if (f.id === 'issueForm') {
      await put('issues', rid('i'), { homeId: f.dataset.h, text: v('if-text').trim(), room: v('if-room').trim(), tradeId: v('if-trade') || null, status: 'open', at: nowIso(), by: meId || null });
      await addLog(f.dataset.h, 'Deficiency logged: ' + v('if-text').trim()); closeModal(); toast('Deficiency logged');
    }
  } catch (err) { const b = f.querySelector('button[type=submit]'); if (b) b.disabled = false; }
});
document.addEventListener('error', e => { const t = e.target; if (t && t.tagName === 'IMG' && t.closest('.photo')) { const s = document.createElement('span'); s.textContent = 'Photo not available in this view'; t.replaceWith(s); } }, true);
window.addEventListener('hashchange', () => { closeModal(); render(); });

/* ---------- connect ---------- */
function subscribe(name, q) {
  const ref = q ? q(db.collection(name)) : db.collection(name);
  ref.onSnapshot(snap => {
    const m = {}; snap.docs.forEach(d => { const x = d.data(); if (x) m[d.id] = name === 'homes' ? { ...x, id: d.id } : x; });
    S[name] = m; if (!snap.metadata.fromCache) loaded[name] = true; else if (!loaded[name] && snap.size) loaded[name] = true;
    render(); if (name === 'homes' && $('#taskModal') && !$('#modal details[open]')) refreshModal();
  }, err => { console.warn(name, err); loaded[name] = true; setConn('Connection lost. Reload to reconnect.', false); render(); });
}
function setConn(text, ok) { const c = $('#conn'); c.innerHTML = '<b></b>' + esc(text); c.classList.toggle('live', !!ok); }
async function start() {
  const hasClaude = typeof window.claude !== 'undefined' && window.claude && window.claude.use;
  if (hasClaude) {
    [db, user, assets] = await Promise.all([window.claude.use('db'), window.claude.use('user'), window.claude.use('assets')]);
  }
  if (!db) {
    preview = true; db = memDB(); canWrite = true; setConn('Preview, not shared', false);
    ['homes', 'trades', 'notices', 'photos', 'issues', 'log'].forEach(n => subscribe(n));
    setTimeout(() => { if (!Object.keys(S.homes).length) loadDemo(); }, 50);
    return;
  }
  if (user) { try { meId = await user.id(); } catch (e) {} try { const w = user.can ? await user.can('data.write') : null; if (w === false) canWrite = false; } catch (e) {} }
  setConn('Live, shared', true); live = true;
  const timer = setTimeout(() => { if (!loaded.homes) { slow = true; setConn('Waiting for the board…', false); render(); } }, 10000);
  ['homes', 'trades', 'notices', 'photos', 'issues'].forEach(n => subscribe(n));
  subscribe('log', c => c.orderBy('at', 'desc').limit(300));
  waitFor(() => loaded.homes, 12000).then(() => { clearTimeout(timer); if (loaded.homes) setConn('Live, shared', true); });
}
render();
start();
setInterval(() => { if (ds(new Date()) !== TODAY) render(); }, 60000);
</script>
